[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kvquant"
version = "0.1.0"
description = "Tested KV-cache quantization for Hugging Face transformers >= 5 (with a silent-no-op stress test)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["llm", "kv-cache", "quantization", "transformers", "inference", "efficiency"]
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
bench = ["transformers>=5.0", "numpy"]
dev = ["pytest", "numpy"]

[project.scripts]
kvquant-bench = "kvquant.bench:_main"

[tool.setuptools.packages.find]
include = ["kvquant*"]
